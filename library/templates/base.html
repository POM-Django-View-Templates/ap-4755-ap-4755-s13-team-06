<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Awesome Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'book_list' %}">📚 Library</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'book_list' %}">Книги</a></li>
                    
                    {% if request.user.is_authenticated and request.user.role == 1 %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'user_list' %}">Користувачі</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'authors_list' %}">Автори</a></li>
                    {% endif %}
                </ul>
                <ul class="navbar-nav">
                    {% if request.user.is_authenticated %}
                        <li class="nav-item"><span class="nav-link text-white">Привіт, {{ request.user.email }}!</span></li>
                        {% else %}
                        {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
