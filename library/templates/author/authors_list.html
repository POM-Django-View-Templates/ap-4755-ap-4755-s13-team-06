{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Список авторів</h2>
    <a href="{% url 'author_create' %}" class="btn btn-primary">+ Додати автора</a>
</div>

<ul class="list-group">
    {% for author in authors %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ author.name }} {{ author.patronymic }} {{ author.surname }}
            
            <form action="{% url 'author_delete' author.id %}" method="POST" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Видалити автора?')">Видалити</button>
            </form>
        </li>
    {% empty %}
        <li class="list-group-item text-muted">Авторів ще немає.</li>
    {% endfor %}
</ul>
{% endblock %}
