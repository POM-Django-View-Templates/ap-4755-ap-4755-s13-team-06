{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Додати нового автора</h3>
        <form action="{% url 'author_create' %}" method="POST" class="card p-4 mt-3">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Ім'я</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">По батькові</label>
                <input type="text" name="patronymic" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Прізвище</label>
                <input type="text" name="surname" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success">Зберегти автора</button>
            <a href="{% url 'authors_list' %}" class="btn btn-secondary mt-2">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
