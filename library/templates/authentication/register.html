{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <h3 class="text-center mb-3">Реєстрація</h3>
        <form action="{% url 'register' %}" method="POST" class="card p-4 shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ім'я</label>
                    <input type="text" name="first_name" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Прізвище</label>
                    <input type="text" name="last_name" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Оберіть роль</label>
                <select name="role" class="form-select">
                    <option value="0">Звичайний читач (Guest)</option>
                    <option value="1">Бібліотекар (Librarian)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Зареєструватись</button>
        </form>
    </div>
</div>
{% endblock %}
