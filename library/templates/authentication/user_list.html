{% extends 'base.html' %}
{% block content %}
<h2>Список користувачів (Admin)</h2>
<div class="list-group">
    {% for usr in users %}
        <a href="{% url 'user_detail' usr.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            {{ usr.email }} 
            {% if usr.role == 1 %}
                <span class="badge bg-primary rounded-pill">Admin</span>
            {% else %}
                <span class="badge bg-secondary rounded-pill">Visitor</span>
            {% endif %}
        </a>
    {% endfor %}
</div>
{% endblock %}
